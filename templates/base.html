<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="app-body-light"
      style="
        background:
          linear-gradient(135deg, rgba(59, 130, 246, 0.20), rgba(16, 185, 129, 0.15)),
          url('{{ url_for('static', filename='images/bg.jpg') }}') center center / cover no-repeat fixed;
      ">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="{{ url_for('home') }}">
      💸 Expense Tracker
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto">
        {% if session.get('user_id') %}
          <li class="nav-item">
            <a href="{{ url_for('home') }}" class="nav-link">Expenses</a>
          </li>
          <li class="nav-item">
            <a href="{{ url_for('chart') }}" class="nav-link">Chart</a>
          </li>
          <li class="nav-item">
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-danger ms-lg-3">
              Logout
            </a>
          </li>
        {% else %}
          <li class="nav-item">
            <a href="{{ url_for('login') }}" class="nav-link">Login</a>
          </li>
          <li class="nav-item">
            <a href="{{ url_for('signup') }}" class="btn btn-sm btn-primary ms-lg-3">
              Sign Up
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="py-4">
  <div class="container fade-in">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
